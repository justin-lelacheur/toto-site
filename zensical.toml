# zensical.toml

[project]
site_name = "toto"
site_url = "https://www.totofoundry.com"
extra_css = [
    "stylesheets/fonts.css",
    "stylesheets/extra.css"
]

# Keep all ten product pages available through a small, legible navigation system.
nav = [
    { "Home" = "index.md" },
    { "Why Toto" = "strategic-vision.md" },
    { "Platform" = [
        { "Platform Overview" = "ontology-fabric.md" },
        { "Enterprise Graph" = "Ontology.md" },
        { "Studio" = "Studio.md" },
        { "Workflow Runtime" = "orchestration-mesh.md" },
        { "AI Governance" = "Factory.md" },
        { "CRM Capabilities" = "capabilities.md" },
    ] },
    { "Company" = [
        { "About Toto" = "about-us.md" },
        { "Contact" = "contact.md" },
    ] },
]

[project.theme]
name = "zensical"
custom_dir = "overrides"
logo = "images/toto-site-logo-black-med.webp"
favicon = "images/toto-favicon-48.png"

features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.tracking",
    "navigation.footer",
    "content.code.copy"
]

