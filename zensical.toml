[project]
site_name = "toto"
site_url = "https://pages.dev"
site_description = "An autonomous, AI-native enterprise operating system."

# Native Zensical Core Theme Configuration
theme = "zensical"
theme_variant = "modern"
theme_palette = "light"

# Fixed: Enabling the explicit navigation tabs feature flag under the theme scope
[project.theme]
features = [
    "navigation.tabs"
]

# Validated Navigation Dictionary Array
[project]
nav = [
    { "Philosophy" = "index.md" },
    { "Capabilities" = "features.md" },
    { "Foundry" = "about.md" },
    { "Inquire" = "contact.md" }
]

# High-Velocity Typography Fonts & Style Sheet Injections
extra_css = [
    "https://googleapis.com"
]
