# zensical.toml

[project]
site_name = "toto"
site_url = "https://www.totofoundry.com"
extra_css = [
    "stylesheets/fonts.css",
    "stylesheets/extra.css"
]

# Navigation uses page paths directly so each top-level item resolves to a real page.
nav = [
    { "Home" = "index.md" },
    { "Strategic Vision" = "strategic-vision.md" },
    { "Platform Specifications" = [
        { "Ontology Fabric" = "ontology-fabric.md" },
    ] },
    { "Company & Insights" = [
        { "About Us" = "about-us.md" },
    ] },
    { "Communication Hub" = "contact.md" },
]

[project.theme]
name = "zensical"
custom_dir = "overrides"
logo = "images/toto-site-logo-black-med.png"
favicon = "images/toto-favicon-48.png"

features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.tracking",
    "navigation.footer",
    "content.code.copy"
]

