# zensical.toml

[project]
site_name = "toto"
site_url = "https://toto-site-3pm.pages.dev"
extra_css = [
    "stylesheets/extra.css"
]

# ── THIS IS YOUR ZENSICAL NAVIGATION MATRIX ──
# Instead of a mkdocs.yml file, Zensical processes your page trees inside this TOML table block.
[project.nav]
"Home" = "index.md"
"Strategic Vision" = "strategic-vision.md"

    # Nested sub-sections use standard TOML indentation paths
    [project.nav."Platform Specifications"]
    "Ontology Fabric" = "ontology-fabric.md"

    [project.nav."Company & Insights"]
    "About Us" = "about-us.md"

"Communication Hub" = "contact.md"

[project.theme]
name = "zensical"
custom_dir = "overrides"
logo = "images/toto-site-logo-black-med.png"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.tracking",
    "content.code.copy"
]
