# zensical.toml

[project]
site_name = "toto"
site_url = "https://www.totofoundry.com"
extra_css = [
    "stylesheets/fonts.css",
    "stylesheets/extra.css"
]

# Keep all ten product pages available through a small, legible navigation system.
nav = [
    { "Home" = "index.md" },
    { "Why toto" = "why-toto.md" },
    { "toto foundry" = [
        { "Platform Overview" = "platform-overview.md" },
        { "Enterprise Graph" = "enterprise-graph.md" },
        { "Studio" = "studio.md" },
        { "Workflow Runtime" = "workflow-runtime.md" },
        { "AI Governance" = "ai-governance.md" },
        { "CRM Module" = "crm-module.md" },
    ] },
    { "Company" = [
        { "About toto" = "about-toto.md" },
        { "Contact" = "contact.md" },
    ] },
]

[project.theme]
name = "zensical"
custom_dir = "overrides"
logo = "images/toto-site-logo-black-med.webp"
favicon = "images/toto-favicon-48.png"

features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.tracking",
    "navigation.footer",
    "content.code.copy"
]

