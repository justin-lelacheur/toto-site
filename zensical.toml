[project]
site_name = "Your Brand Name"
site_url = "https://example.com"
extra_css = [
    "stylesheets/custom.css"
]

[project.theme]
name = "material"
logo = "images/toto-site-logo-white-med.png"
# 💡 CRITICAL: These features force Zensical to generate the sidebar layout blocks!
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.tracking",
    "content.code.copy"
]
