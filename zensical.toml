[project]
site_name = "toto-site"
site_url = "https://example.com"
extra_css = [
    "stylesheets/custom.css"
]

[project.theme]
name = "material"
logo = "images/toto-site-logo-white-med.png"
custom_dir = "overrides" # Forces Zensical to index your main.html template layout overrides
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.tracking",
    "content.code.copy"
]
